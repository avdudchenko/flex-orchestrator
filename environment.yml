# Deployment environment for flex-orchestrator.
# Upstream packages are pinned to exact commits; bump SHAs in the same PR that
# needs them. Run `idaes get-extensions` after creation for IPOPT.
# Usage: conda env create -f environment.yml
name: flex-orch
channels:
  - conda-forge
dependencies:
  - python=3.12
  - scip=10.0
  - highspy=1.15
  - pip
  - pip:
      # flex-pse v0.3.0 (upstream tag; flowsheet spec schema 0.1.1, adds flexdesign)
      - "flex-pse[parameterize,solvers] @ git+https://github.com/flex-pse/flex-pse.git@809b25b6fba346cd6fcc5960e2d80db267e1c7fe"
      # Ray 2.60.0 crashes in ray.shutdown() on Windows; drop this once a newer one doesn't.
      - "ray<2.60"
      # Acquirium main (b7f6fc8, 2026-11-09, the v0.4.0a9 release commit), pinned by SHA.
      # We track main rather than PyPI; move the SHA forward deliberately and rerun the suite.
      - "acquirium @ git+https://github.com/DataDrivenCPS/acquirium.git@b7f6fc8a764345dd172e9217cc25f255255493ad"
