# Deployment environment for flex-orchestrator.
# Upstream packages are pinned to exact commits; bump SHAs in the same PR that
# needs them. Run `idaes get-extensions` after creation for IPOPT.
# Usage: conda env create -f environment.yml
name: flex-orch
channels:
  - conda-forge
dependencies:
  - python=3.12
  - scip=10.0
  - highspy=1.15
  - pip
  - pip:
      # flex-pse @ arima_integration
      - "flex-pse[parameterize,solvers] @ git+https://github.com/avdudchenko/flex-pse.git@1fe4059e233796b6dec263ff3c72eb06a8fad3a8"
      # Acquirium PR #78 (experiment-interface) - switch to a PyPI release once merged
      - "acquirium @ git+https://github.com/DataDrivenCPS/acquirium.git@a74b3bcd682a781bdefac93cc17d415153672dd8"
      # - "flex-orchestrator[server] @ ."   # enable once M0 adds pyproject.toml
